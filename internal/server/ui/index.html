<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flovr</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>
<div class="app" id="app">
  <nav id="rail" class="rail" aria-label="Sections">
    <svg class="logo" width="30" height="30" viewBox="0 0 24 24" role="img" aria-label="flovr"><rect class="lg-bg" width="24" height="24" rx="6.5"></rect><g class="lg-line"><path d="M5 7.8c2.3-1.9 4.7-1.9 7 0s4.7 1.9 7 0" opacity="0.35"></path><path d="M5 12c2.3-1.9 4.7-1.9 7 0s4.7 1.9 7 0" opacity="0.65"></path><path d="M5 16.2c2.3-1.9 4.7-1.9 7 0s4.7 1.9 7 0"></path></g></svg>
  </nav>
  <header class="top">
    <nav id="crumb" class="crumb" aria-label="Current workflow or component"></nav>
    <div id="tabs" class="tabs" role="tablist" aria-label="View"></div>
    <span id="changes" class="changes-slot"></span>
    <span id="live" class="live" role="status"></span>
  </header>
  <main id="canvas" class="canvas" aria-label="Drawing of the selected workflow or component"></main>
  <aside id="inspector" class="inspector" aria-label="Details"></aside>
  <main id="home" class="home" aria-label="List"></main>
</div>
<script src="/ui/app.js"></script>
</body>
</html>
