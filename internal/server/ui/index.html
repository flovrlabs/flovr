<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flowmaker</title>
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>
<div class="app" id="app">
  <nav id="rail" class="rail" aria-label="Sections">
    <svg class="logo" width="30" height="30" viewBox="0 0 24 24" role="img" aria-label="flowmaker"><rect class="lg-bg" width="24" height="24" rx="7"></rect><circle class="lg-ink" cx="8" cy="7" r="2.3"></circle><circle class="lg-ink" cx="16" cy="17" r="2.3"></circle><path class="lg-line" d="M8 9.6v2.4a3 3 0 0 0 3 3h2.4"></path></svg>
  </nav>
  <header class="top">
    <nav id="crumb" class="crumb" aria-label="Current workflow or component"></nav>
    <div id="tabs" class="tabs" role="tablist" aria-label="View"></div>
    <span id="changes" class="changes-slot"></span>
    <span id="live" class="live" role="status"></span>
  </header>
  <main id="canvas" class="canvas" aria-label="Drawing of the selected workflow or component"></main>
  <aside id="inspector" class="inspector" aria-label="Details"></aside>
  <main id="home" class="home" aria-label="List"></main>
</div>
<script src="/ui/app.js"></script>
</body>
</html>
