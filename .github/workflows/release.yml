name: Release

# A tag such as v0.1.0 builds flowmaker for Linux, macOS and Windows,
# publishes the archives as a GitHub release, the Homebrew cask if the tap's
# token is set, and the image as ghcr.io/simonyosb/flowmaker. A pull request
# that changes how releases are built or installed makes the same archives and
# image without publishing them, and installs from them.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release.yml
      - install.sh
      - Dockerfile
      - .dockerignore

permissions:
  contents: read

jobs:
  snapshot:
    name: Build the release without publishing it
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
      # install.sh must find, check and install what a release holds.
      - name: Install from the archives
        run: |
          version=$(jq -r .version dist/metadata.json)
          mkdir -p "$RUNNER_TEMP/releases/download/v$version"
          cp dist/*.tar.gz dist/checksums.txt "$RUNNER_TEMP/releases/download/v$version/"
          FLOWMAKER_REPO_URL="file://$RUNNER_TEMP" FLOWMAKER_VERSION="v$version" FLOWMAKER_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/flowmaker" version
      - name: Build the image
        run: docker build --build-arg VERSION=snapshot -t flowmaker:snapshot .
      - name: Try the examples in the image, without a key or a network
        run: docker run --rm --network none flowmaker:snapshot test /examples/triage-ticket --replay

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only this job, which runs for tags alone, may write to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - run: go test ./...
      - name: Look for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty unless the secret is set, which leaves the cask unpublished.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  image:
    name: Publish the image
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The image's own steps run for each platform, under emulation.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # latest goes along with the version of a release that is not a
          # pre-release.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
