name: Release

# A tag such as v0.1.0 builds flowmaker for Linux, macOS and Windows and
# publishes the archives as a GitHub release. A pull request that changes how
# releases are built makes the same archives without publishing them.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    name: Build the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: ${{ startsWith(github.ref, 'refs/tags/') && 'release --clean' || 'release --snapshot --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
