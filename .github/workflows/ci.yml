name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Started by hand from the Actions tab, the example tests call the models
  # for real, which costs money. Every other run replays recorded answers.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Go code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # The newest patch release, which has the standard library's fixes.
          go-version: "1.26.x"
          check-latest: true
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - name: Look for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  workflows:
    name: Example workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Only a run started by hand gets the key. Pull requests from forks
      # never have it.
      OPENROUTER_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.OPENROUTER_API_KEY || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # The newest patch release, which has the standard library's fixes.
          go-version: "1.26.x"
          check-latest: true
      - name: Build flovr
        run: go build -o "$RUNNER_TEMP/flovr" ./cmd/flovr
      - name: Validate workflows
        run: |
          failed=0
          for dir in examples/*/; do
            "$RUNNER_TEMP/flovr" validate "$dir" || failed=1
          done
          exit $failed
      # ai and decide steps call their models for real; http steps are not sent.
      - name: Test workflows
        if: env.OPENROUTER_API_KEY != ''
        run: |
          failed=0
          for dir in examples/*/; do
            "$RUNNER_TEMP/flovr" test "$dir" || failed=1
          done
          # Components have tests of their own.
          for file in $(find examples -name component.yaml); do
            "$RUNNER_TEMP/flovr" test "$file" || failed=1
          done
          exit $failed
      # Without the key the tests get the answers recorded in answers.jsonl,
      # which checks the workflows but not what the models answer.
      - name: Test workflows with recorded answers
        if: env.OPENROUTER_API_KEY == ''
        run: |
          echo "::notice::The workflow tests replay recorded answers and call no model. To call the models, run CI by hand from the Actions tab."
          failed=0
          for dir in examples/*/; do
            "$RUNNER_TEMP/flovr" test --replay "$dir" || failed=1
          done
          for file in $(find examples -name component.yaml); do
            "$RUNNER_TEMP/flovr" test --replay "$file" || failed=1
          done
          exit $failed
