# Builds the release archives when a version tag is pushed; see
# .github/workflows/release.yml.
version: 2
project_name: flovr

builds:
  - main: ./cmd/flovr
    binary: flovr
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

# brew install flovrlabs/tap/flovr. The cask is written to the
# flovrlabs/homebrew-tap repository, with a token that may write to it in the
# HOMEBREW_TAP_GITHUB_TOKEN secret; without that secret it is not published.
homebrew_casks:
  - name: flovr
    binaries: [flovr]
    homepage: https://github.com/flovrlabs/flovr
    description: AI workflows as YAML files in git, with tests that call the models
    license: Apache-2.0
    repository:
      owner: flovrlabs
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "" }}'
    commit_author:
      name: flovr releases
      email: noreply@github.com
    skip_upload: '{{ if envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "" }}false{{ else }}true{{ end }}'
    # The binary is not signed by Apple, so macOS would refuse to open it
    # once Homebrew has downloaded it.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/flovr"]
          end
